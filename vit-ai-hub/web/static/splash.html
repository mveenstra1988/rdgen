<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VIT AI Hub</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Outfit", system-ui, sans-serif;
      display: grid;
      place-items: center;
      background:
        radial-gradient(700px 360px at 20% 0%, rgba(240,165,0,.22), transparent 55%),
        #111;
      color: #f6f5f2;
    }
    .wrap { text-align: center; padding: 2rem; max-width: 28rem; }
    img {
      width: min(280px, 80vw);
      height: auto;
      background: #111;
      border-radius: 14px;
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
    }
    h1 { margin: 0 0 0.35rem; font-size: 1.6rem; letter-spacing: -0.03em; }
    p { margin: 0; color: #b8b3a8; font-size: 0.95rem; line-height: 1.45; }
    .bar {
      margin: 1.4rem auto 0;
      width: 180px; height: 3px;
      border-radius: 99px;
      background: rgba(255,255,255,.08);
      overflow: hidden;
    }
    .bar > i {
      display: block; height: 100%; width: 40%;
      background: #f0a500;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    .err { color: #ff8f8f; margin-top: 1rem; font-size: 0.85rem; display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="/static/logo-wordmark.png" alt="Veenstra IT" />
    <h1>AI Hub</h1>
    <p id="msg">Even geduld — hub start…</p>
    <div class="bar" aria-hidden="true"><i></i></div>
    <p class="err" id="err"></p>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const dest = params.get("next") || "/?wizard=1";
    const msg = document.getElementById("msg");
    const err = document.getElementById("err");
    let n = 0;
    async function tick() {
      n += 1;
      try {
        const r = await fetch("/health", { cache: "no-store" });
        if (r.ok) {
          msg.textContent = "Klaar — openen…";
          location.replace(dest);
          return;
        }
      } catch (_) {}
      if (n > 90) {
        err.style.display = "block";
        err.textContent = "Start duurt te lang. Check ~/Library/Logs/VIT-AI-Hub/";
        return;
      }
      if (n > 8) msg.textContent = "Eerste keer kan even duren (Python-omgeving)…";
      setTimeout(tick, 500);
    }
    tick();
  </script>
</body>
</html>
