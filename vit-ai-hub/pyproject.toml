[project]
name = "vit-ai-hub"
version = "2.6.6"
description = "Lokale VIT AI Hub met privacyfilter en multi-provider modelpicker"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "eval_type_backport>=0.2.0",
  "typing_extensions>=4.12.0",
  "pyyaml>=6.0.2",
  "python-multipart>=0.0.12",
  "sse-starlette>=2.1.0",
  "jinja2>=3.1.4",
  "orjson>=3.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]